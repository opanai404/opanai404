<svg width="720" height="300" viewBox="0 0 720 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Vectrix — SIMD-accelerated vector search engine</title>
  <desc id="desc">Project card for Vectrix, an embedded vector search engine in Rust with hybrid HNSW and IVF-PQ indexes.</desc>
  <defs>
    <linearGradient id="bg" x1="24" y1="20" x2="696" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A1A31"/>
      <stop offset="1" stop-color="#102746"/>
    </linearGradient>
  </defs>
  <rect width="720" height="300" rx="20" fill="url(#bg)"/>
  <rect x="1" y="1" width="718" height="298" rx="19" stroke="#A78BFA" stroke-opacity="0.38" stroke-width="2"/>
  <circle cx="636" cy="64" r="116" fill="#A78BFA" fill-opacity="0.07"/>
  <text x="40" y="54" fill="#DDD6FE" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" letter-spacing="2.4">FRONTIER SYSTEMS · VECTOR SEARCH</text>
  <text x="40" y="112" fill="#F8FAFC" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="38" font-weight="760">Vectrix</text>
  <text x="40" y="151" fill="#B8C9E0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17">SIMD-accelerated embedded vector search with hybrid</text>
  <text x="40" y="176" fill="#B8C9E0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17">HNSW + IVF-PQ indexes and WebAssembly export.</text>
  <g>
    <rect x="40" y="216" width="56" height="34" rx="17" fill="#16334F"/>
    <text x="51" y="238" fill="#DDD6FE" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700">RUST</text>
    <rect x="108" y="216" width="56" height="34" rx="17" fill="#16334F"/>
    <text x="119" y="238" fill="#DDD6FE" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700">SIMD</text>
    <rect x="176" y="216" width="60" height="34" rx="17" fill="#16334F"/>
    <text x="189" y="238" fill="#DDD6FE" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700">HNSW</text>

    <rect x="38" y="24" width="12" height="36" rx="4" fill="#A78BFA"/>
    <rect x="58" y="40" width="12" height="20" rx="4" fill="#A78BFA" fill-opacity="0.35"/>
    <rect x="78" y="16" width="12" height="44" rx="4" fill="#A78BFA" fill-opacity="0.7"/>
    <circle cx="98" cy="20" r="5" fill="#EDE9FE"/>

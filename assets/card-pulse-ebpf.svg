<svg width="720" height="300" viewBox="0 0 720 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Pulse — eBPF observability platform</title>
  <desc id="desc">Project card for Pulse, an eBPF observability platform exporting OpenTelemetry metrics and traces.</desc>
  <defs>
    <linearGradient id="bg" x1="24" y1="20" x2="696" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A1A31"/>
      <stop offset="1" stop-color="#102746"/>
    </linearGradient>
  </defs>
  <rect width="720" height="300" rx="20" fill="url(#bg)"/>
  <rect x="1" y="1" width="718" height="298" rx="19" stroke="#F87171" stroke-opacity="0.38" stroke-width="2"/>
  <circle cx="636" cy="64" r="116" fill="#F87171" fill-opacity="0.07"/>
  <text x="40" y="54" fill="#FECACA" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" letter-spacing="2.4">FRONTIER SYSTEMS · OBSERVABILITY</text>
  <text x="40" y="112" fill="#F8FAFC" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="38" font-weight="760">Pulse</text>
  <text x="40" y="151" fill="#B8C9E0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17">Low-overhead eBPF observability tracing syscalls and</text>
  <text x="40" y="176" fill="#B8C9E0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17">TCP events into OpenTelemetry metric streams.</text>
  <g>
    <rect x="40" y="216" width="60" height="34" rx="17" fill="#16334F"/>
    <text x="53" y="238" fill="#FECACA" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700">eBPF</text>
    <rect x="112" y="216" width="68" height="34" rx="17" fill="#16334F"/>
    <text x="124" y="238" fill="#FECACA" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700">CO-RE</text>
    <rect x="192" y="216" width="60" height="34" rx="17" fill="#16334F"/>
    <text x="205" y="238" fill="#FECACA" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700">OTEL</text>
  </g>
  <g transform="translate(556 178)">
    <rect width="112" height="72" rx="12" fill="#112A49" stroke="#F87171" stroke-opacity="0.5"/>
    <polyline points="16,40 28,40 34,30 42,50 48,22 56,40 64,40 70,34 78,46 84,28 90,40 96,40"
      fill="none" stroke="#F87171" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="96" cy="40" r="4" fill="#FECACA"/>
    <line x1="16" y1="52" x2="96" y2="52" stroke="#F87171" stroke-opacity="0.35"/>
  </g>
</svg>

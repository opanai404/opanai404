  </defs>
  <rect width="720" height="300" rx="20" fill="url(#bg)"/>
  <rect x="1" y="1" width="718" height="298" rx="19" stroke="#FBBF24" stroke-opacity="0.38" stroke-width="2"/>
  <circle cx="636" cy="64" r="116" fill="#FBBF24" fill-opacity="0.07"/>

<svg width="720" height="300" viewBox="0 0 720 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Zephyr — zero-knowledge circuit toolkit</title>
  <desc id="desc">Project card for Zephyr, a zero-knowledge circuit toolkit with pluggable STARK and Groth16 backends.</desc>
